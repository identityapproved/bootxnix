# bootxnix tmux. Ported from lainland, trimmed for a single-terminal (st) box:
# no TPM, no lain.tmux, no resurrect/continuum, no Claude pane. Rose Pine status
# styled by hand.

unbind r
bind r source-file /etc/tmux.conf

# Terminal. st sets TERM=st-256color and takes RGB; declare truecolor so the
# Rose Pine themes in bat/delta/eza/vim don't collapse to the 256-colour cube.
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set-environment -g COLORTERM truecolor

set -sg escape-time 10
set -g focus-events on

# Prefix C-s (+ C-s send-prefix).
set -g prefix C-s
set -g prefix2 C-s
bind C-s send-prefix -2

# Splits, keeping the current path.
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vi copy mode; y yanks to the X clipboard via xclip.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind Enter copy-mode

# Pane resize - prefix, repeatable.
bind -r h resize-pane -L 13
bind -r j resize-pane -D 13
bind -r k resize-pane -U 13
bind -r l resize-pane -R 13

# Pane selection - no prefix. Passes through to a pane running vim/fzf so
# vim-tmux-navigator and fzf-lua get C-hjkl; a plain shell switches panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind C-l send-keys C-l

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind C-p previous-window
bind C-n next-window

# --- Rose Pine status (hand-styled) ---------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#191724,fg=#908caa"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#c4a7e7,fg=#191724,bold] #S #[bg=#191724,fg=#c4a7e7]#[default] "
set -g status-right "#[fg=#31748f]#{?client_prefix,#[fg=#eb6f92]PREFIX ,}#[fg=#6e6a86]%d.%m.%Y #[fg=#e0def4]%H:%M "
setw -g window-status-format "#[fg=#6e6a86] #I:#W "
setw -g window-status-current-format "#[bg=#26233a,fg=#ebbcba,bold] #I:#W "
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#403d52"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g mode-style "bg=#403d52,fg=#e0def4"
